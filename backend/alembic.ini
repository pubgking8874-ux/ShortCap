# ShortsCap backend — Alembic configuration (architecture placeholder).
# Alembic will be configured properly when migrations are introduced.
# The database URL is supplied via environment variables (see .env.example).

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally NOT hardcoded here — it comes from env.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
